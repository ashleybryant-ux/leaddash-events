# nginx site for LeadDash Events (events.leaddash.io -> port 4200).
# setup.sh copies this into place; certbot then adds HTTPS to it.
server {
    listen 80;
    server_name events.leaddash.io;

    client_max_body_size 110m;  # slide decks up to 100 MB (streamed), plus headshots and logos

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
